# Test intentionally has no recurring tasks. The normal test adapter never
# starts a scheduler; development and production list the same business work
# explicitly so a local worker does not silently exercise a different set.

development:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  retention_purge:
    class: RetentionPurgeJob
    queue: retention
    priority: 50
    args:
      - batch_size: 500
    schedule: every 15 minutes

test: {}

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  retention_purge:
    class: RetentionPurgeJob
    queue: retention
    priority: 50
    args:
      - batch_size: 500
    schedule: every 15 minutes
