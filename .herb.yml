# Herb configuration for HTML+ERB templates.
# Configuration reference: https://herb-tools.dev/configuration
#
# The Herb Linter replaces erb_lint (docs/backlog/2026-11-10-herb-migration.md). Run it with
# `bunx --bun herb-lint`. Rendering still uses Erubi; switching `erb_implementation` to Herb is a
# separate phase of that plan. The formatter is out of scope.

version: 0.11.2

framework: actionview

files:
  exclude:
    - "vendor/**/*"
    - "node_modules/**/*"
    - "tmp/**/*"
    - "public/**/*"
    - "coverage/**/*"

engine:
  validators:
    security: true
    nesting: true
    accessibility: true

linter:
  enabled: true
  # erb_lint failed on every offense; keep warnings as failures too.
  failLevel: warning

formatter:
  enabled: false
