# Config used by `ArchitectureBaseline.measure`: the two architecture cops only, with all files
# measured so the ratchet rejects new debt even before the full RuboCop run.
inherit_from:
  - umaxica.yml

AllCops:
  TargetRubyVersion: 4.0
  DisabledByDefault: true
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "node_modules/**/*"
    - "tmp/**/*"
    - "log/**/*"
  Include:
    - "app/**/*.rb"
    - "lib/**/*.rb"
