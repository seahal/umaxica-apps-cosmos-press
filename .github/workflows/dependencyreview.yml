# Dependency Review Action
#
# Scans dependency manifest files changed in a Pull Request for known-vulnerable package
# versions. If this workflow is marked as a required check, PRs introducing known-vulnerable
# packages are blocked from merging.
#
# https://github.com/actions/dependency-review-action
name: "Dependency Review"
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: true
